# Avenit — pełny stack na VPS (Hostinger). Zastępuje Vercel + Supabase.
#
#   docker compose up -d
#
# Wymaga pliku .env (skopiuj z deploy/.env.production.example).
# Wildcard DNS *.${APP_DOMAIN} → IP VPS.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avenit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: avenit_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avenit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Nie wystawiamy portu na świat — dostęp tylko z sieci compose.

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      APP_DOMAIN: ${APP_DOMAIN}
      PUBLIC_API_URL: https://api.${APP_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-avenit}:${POSTGRES_PASSWORD}@postgres:5432/avenit_platform
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_DIR: /srv/storage
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAILING_FROM_EMAIL: ${MAILING_FROM_EMAIL:-noreply@avenit.pl}
      MAILING_FROM_NAME: ${MAILING_FROM_NAME:-Avenit}
      DEFAULT_SMTP_HOST: ${DEFAULT_SMTP_HOST:-}
      DEFAULT_SMTP_PORT: ${DEFAULT_SMTP_PORT:-465}
      DEFAULT_SMTP_USER: ${DEFAULT_SMTP_USER:-}
      DEFAULT_SMTP_PASS: ${DEFAULT_SMTP_PASS:-}
      LANDING_CONTACT_EMAIL: ${LANDING_CONTACT_EMAIL:-lukasz@avenit.pl}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@avenit.pl}
      SMSAPI_TOKEN: ${SMSAPI_TOKEN:-}
      SMSAPI_DEFAULT_SENDER: ${SMSAPI_DEFAULT_SENDER:-}
      SMSAPI_WEBHOOK_SECRET: ${SMSAPI_WEBHOOK_SECRET:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:lukasz@avenit.pl}
      MAIL_ENCRYPTION_SECRET: ${MAIL_ENCRYPTION_SECRET:-}
      P24_MERCHANT_ID: ${P24_MERCHANT_ID:-}
      P24_POS_ID: ${P24_POS_ID:-}
      P24_CRC: ${P24_CRC:-}
      P24_API_KEY: ${P24_API_KEY:-}
      P24_SANDBOX: ${P24_SANDBOX:-true}
      # Połączenia audio/wideo (LiveKit). Puste klucze = połączenia wyłączone (503 calls_disabled).
      LIVEKIT_URL: ${LIVEKIT_URL:-}   # puste = wss://rtc.<APP_DOMAIN>
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - storage:/srv/storage

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_DOMAIN: ${APP_DOMAIN}
      PUBLIC_API_URL: https://api.${APP_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-avenit}:${POSTGRES_PASSWORD}@postgres:5432/avenit_platform
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_DIR: /srv/storage
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAILING_FROM_EMAIL: ${MAILING_FROM_EMAIL:-noreply@avenit.pl}
      MAILING_FROM_NAME: ${MAILING_FROM_NAME:-Avenit}
      DEFAULT_SMTP_HOST: ${DEFAULT_SMTP_HOST:-}
      DEFAULT_SMTP_PORT: ${DEFAULT_SMTP_PORT:-465}
      DEFAULT_SMTP_USER: ${DEFAULT_SMTP_USER:-}
      DEFAULT_SMTP_PASS: ${DEFAULT_SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@avenit.pl}
      SMSAPI_TOKEN: ${SMSAPI_TOKEN:-}
      SMSAPI_DEFAULT_SENDER: ${SMSAPI_DEFAULT_SENDER:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:lukasz@avenit.pl}
      MAIL_ENCRYPTION_SECRET: ${MAIL_ENCRYPTION_SECRET:-}
      LANDING_CONTACT_EMAIL: ${LANDING_CONTACT_EMAIL:-lukasz@avenit.pl}
      # Worker (call-sweep) uzgadnia stan połączeń z LiveKit (lista pokoi).
      LIVEKIT_URL: ${LIVEKIT_URL:-}   # puste = wss://rtc.<APP_DOMAIN>
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - storage:/srv/storage

  # SFU LiveKit — połączenia audio/wideo w Komunikatorze (1:1 i grupowe, do ~30 osób z wideo).
  # Sygnalizacja (WebSocket) przez Caddy: wss://rtc.${APP_DOMAIN} → livekit:7880 (port 7880 NIE
  # jest wystawiany na świat). Media wprost do VPS: UDP 7882 (jeden port, mux) i awaryjnie
  # ICE/TCP 7881 — oba porty muszą być otwarte w firewallu VPS. Klucze tylko z .env (nie w repo);
  # bez nich serwer nie wystartuje (API i tak ma połączenia wyłączone).
  # Webhook do API podpisywany kluczem API (weryfikacja: packages/api/src/calls/routes.js).
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        logging:
          level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        room:
          auto_create: true
          empty_timeout: 30
          departure_timeout: 20
          max_participants: 40
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:3001/api/calls/livekit-webhook
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

  # Buduje statyczne SPA do wolumenów (jednorazowo przy deploy).
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""   # same-origin (Caddy proxuje /api)
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}   # web push (VAPID) — z .env
    volumes:
      - web_dist:/web_out
      - admin_dist:/admin_out
    command: ["sh", "-c", "rm -rf /web_out/* /admin_out/* && cp -r /out/. /web_out/ && cp -r /out-admin/. /admin_out/ && echo 'Frontend skopiowany'"]
    restart: "no"

  caddy:
    build:
      context: ./deploy
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@avenit.pl}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/static:/srv/static:ro
      - web_dist:/srv/web:ro
      - admin_dist:/srv/admin:ro
      - storage:/srv/storage:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  web_dist:
  admin_dist:
  caddy_data:
  caddy_config:
